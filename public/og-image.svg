<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EFF6FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DBEAFE;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Shield Icon -->
  <g transform="translate(520, 140)">
    <path d="M80 10 L150 40 L150 100 C150 140 130 170 80 190 C30 170 10 140 10 100 L10 40 Z"
          fill="#2563EB" stroke="#1E40AF" stroke-width="4"/>
    <path d="M70 90 L90 110 L120 70"
          fill="none" stroke="white" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Logo Text -->
  <text x="600" y="280" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="#111827" text-anchor="middle">
    MyHealthStatus
  </text>

  <!-- Tagline -->
  <text x="600" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="600" fill="#2563EB" text-anchor="middle">
    Your Test Results. Connected. Verified. Shareable.
  </text>

  <!-- Description -->
  <text x="600" y="400" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#6B7280" text-anchor="middle">
    Connect to verified test results from partnered clinics.
  </text>
  <text x="600" y="435" font-family="system-ui, -apple-system, sans-serif" font-size="24" fill="#6B7280" text-anchor="middle">
    Share securely with partners via QR codes.
  </text>

  <!-- Trust Badges -->
  <g transform="translate(280, 480)">
    <!-- HIPAA Badge -->
    <rect x="0" y="0" width="200" height="60" rx="8" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <text x="100" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#059669" text-anchor="middle">
      🔒 HIPAA Compliant
    </text>
  </g>

  <g transform="translate(500, 480)">
    <!-- Clinics Badge -->
    <rect x="0" y="0" width="200" height="60" rx="8" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <text x="100" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#2563EB" text-anchor="middle">
      150+ Clinics
    </text>
  </g>

  <g transform="translate(720, 480)">
    <!-- Encrypted Badge -->
    <rect x="0" y="0" width="200" height="60" rx="8" fill="white" stroke="#D1D5DB" stroke-width="2"/>
    <text x="100" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#7C3AED" text-anchor="middle">
      🛡️ Encrypted
    </text>
  </g>
</svg>
